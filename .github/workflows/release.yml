name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  BINARY_NAME: ntk
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: GNU Linux (ubuntu-latest)
  # Only build libpcap variant
  # Will require glibc 2.28+
  # If you want native, use the musl one on GNU
  # ─────────────────────────────────────────────
  build-linux-gnu:
    name: Build Linux GNU glibc 2.28
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install libpcap dev
        run: dnf install -y libpcap-devel

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-gnu-cargo-

      - name: Build (with-libpcap)
        run: cargo build --release --no-default-features --features with-libpcap --target x86_64-unknown-linux-gnu

      - name: Package pcap binary
        run: |
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-linux-gnu-x86-pcap.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release ${{ env.BINARY_NAME }}
          rm target/x86_64-unknown-linux-gnu/release/${{ env.BINARY_NAME }}

      - name: Upload GNU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-binaries
          path: dist/*.tar.gz

  # ─────────────────────────────────────────────
  # Job 2: musl Linux (native Alpine container)
  # Build both native and libpcap
  # Provides maximum portability for Alpine
  # The musl native build can be used on GNU as well
  # ─────────────────────────────────────────────
  build-linux-musl:
    name: Build Linux musl
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            curl \
            bash \
            gcc \
            musl-dev \
            libpcap-dev \
            pkgconf

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-musl-cargo-

      - name: Build (no features)
        run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl

      - name: Package native binary
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-linux-musl-x86-native.tar.gz \
            -C target/x86_64-unknown-linux-musl/release ${{ env.BINARY_NAME }}
          rm target/x86_64-unknown-linux-musl/release/${{ env.BINARY_NAME }}

      - name: Build (with-libpcap)
        run: cargo build --release --no-default-features --features with-libpcap --target x86_64-unknown-linux-musl

      - name: Package pcap binary
        run: |
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-linux-musl-x86-pcap.tar.gz \
            -C target/x86_64-unknown-linux-musl/release ${{ env.BINARY_NAME }}
          rm target/x86_64-unknown-linux-musl/release/${{ env.BINARY_NAME }}

      - name: Upload musl artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-binaries
          path: dist/*.tar.gz

# ─────────────────────────────────────────────
  # Job 3: musl Linux ARM (native Alpine container)
  # Build both native and libpcap for aarch64
  # Targets AWS Graviton, Alpine ARM, ARM servers
  # The musl native build can be used on GNU ARM as well
  # ─────────────────────────────────────────────
  build-linux-musl-arm:
    name: Build Linux musl ARM
    runs-on: ubuntu-latest
    container:
      image: arm64v8/alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            curl \
            bash \
            gcc \
            musl-dev \
            libpcap-dev \
            pkgconf

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-musl-arm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-musl-arm-cargo-

      - name: Build (no features)
        run: cargo build --release --no-default-features --target aarch64-unknown-linux-musl

      - name: Package native binary
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-linux-musl-arm64-native.tar.gz \
            -C target/aarch64-unknown-linux-musl/release ${{ env.BINARY_NAME }}
          rm target/aarch64-unknown-linux-musl/release/${{ env.BINARY_NAME }}

      - name: Build (with-libpcap)
        run: cargo build --release --no-default-features --features with-libpcap --target aarch64-unknown-linux-musl

      - name: Package pcap binary
        run: |
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-linux-musl-arm64-pcap.tar.gz \
            -C target/aarch64-unknown-linux-musl/release ${{ env.BINARY_NAME }}
          rm target/aarch64-unknown-linux-musl/release/${{ env.BINARY_NAME }}

      - name: Upload musl ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-arm-binaries
          path: dist/*.tar.gz

  # ─────────────────────────────────────────────
  # Job 4: Windows (windows-latest)
  # Package both native and libpcap
  # Full features require libpcap (npcap) on Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Fetch Npcap SDK
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\Get-NpcapSDK.ps1

      - name: Build (no features)
        run: cargo build --release --no-default-features --target x86_64-pc-windows-msvc

      - name: Package native binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive `
            -Path   target\x86_64-pc-windows-msvc\release\${{ env.BINARY_NAME }}.exe `
            -DestinationPath dist\${{ env.BINARY_NAME }}-${{ env.VERSION }}-windows-x86-native.zip
          Remove-Item target\x86_64-pc-windows-msvc\release\${{ env.BINARY_NAME }}.exe

      - name: Build (with-libpcap)
        run: cargo build --release --no-default-features --features with-libpcap --target x86_64-pc-windows-msvc

      - name: Package pcap binary
        shell: pwsh
        run: |
          Compress-Archive `
            -Path   target\x86_64-pc-windows-msvc\release\${{ env.BINARY_NAME }}.exe `
            -DestinationPath dist\${{ env.BINARY_NAME }}-${{ env.VERSION }}-windows-x86-pcap.zip
          Remove-Item target\x86_64-pc-windows-msvc\release\${{ env.BINARY_NAME }}.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*.zip

  # ─────────────────────────────────────────────
  # Job 5: macOS Intel (x86_64)
  # Include the libpcap variant only
  # The equivalent of libpcap is native on MacOS
  # ─────────────────────────────────────────────
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-intel-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-intel-cargo-

      - name: Build (with-libpcap)
        run: cargo build --release --no-default-features --features with-libpcap --target x86_64-apple-darwin

      - name: Package pcap binary
        run: |
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-macos-intel-x86-pcap.tar.gz \
            -C target/x86_64-apple-darwin/release ${{ env.BINARY_NAME }}
          rm target/x86_64-apple-darwin/release/${{ env.BINARY_NAME }}

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-binaries
          path: dist/*.tar.gz

  # ─────────────────────────────────────────────
  # Job 6: macOS Apple Silicon (aarch64)
  # Include the libpcap variant only
  # The equivalent of libpcap is native on MacOS
  # ─────────────────────────────────────────────
  build-macos-arm:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm-cargo-

      - name: Build (with-libpcap)
        run: cargo build --release --no-default-features --features with-libpcap --target aarch64-apple-darwin

      - name: Package pcap binary
        run: |
          tar -czf dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-macos-arm64-pcap.tar.gz \
            -C target/aarch64-apple-darwin/release ${{ env.BINARY_NAME }}
          rm target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }}

      - name: Upload Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-binaries
          path: dist/*.tar.gz

  # ─────────────────────────────────────────────
  # Job 7: GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-linux-gnu, build-linux-musl, build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # dist/ntk-linux-gnu-pcap.tar.gz etc.
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

