[package]
name = "ntk"
version = "0.3.1"
edition = "2024"
description = "Cross-platform network diagnostics toolkit"
keywords = ["network", "diagnostics", "cli", "ping", "scanner"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# CLI
clap = { version = "4.6.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.50.0", features = ["full"] }

# Networking
dns-lookup = "3.0.1"
netdev = "0.41.0"
reqwest = { version = "0.13.2", features = ["json", "stream"] }

# Feature Only Networking
# (Windows doesn't have a native libpcap)
pnet = { version = "0.34", optional = true }
pcap = { version = "2.4.0", optional = true }

# Other
rand = "0.10.0"
serde_json = "1.0.149"
futures-util = "0.3.32"
url = "2.5.8"

# Unix natively has pnet support without libpcap
[target.'cfg(unix)'.dependencies]
pnet = "0.34"

[features]
default = []
with-libpcap = ["dep:pcap", "dep:pnet"]
